<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>국세청 내부자격시험 문제은행</title>
  <style>
    :root {
      --nts-navy: #013762;
      --nts-red: #E3062F;
      --nts-gray: #59595A;
      --nts-sub-gray: #CDC8CB;
      --nts-light-gray: #F3F6FA;
      --nts-border: #D8E0EA;
      --nts-white: #FFFFFF;
      --nts-success: #0F766E;
      --nts-warning: #B45309;
      --nts-error: #B91C1C;
      --text-main: #172033;
      --shadow: 0 18px 45px rgba(1, 55, 98, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: var(--nts-light-gray);
      color: var(--text-main);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app-shell {
      width: 100%;
      min-height: 100vh;
      padding: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .page {
      width: 100%;
      display: none;
    }

    .page.active {
      display: block;
    }

    .card {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      background: var(--nts-white);
      border: 1px solid var(--nts-border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .login-card {
      max-width: 440px;
    }

    .brand-header {
      padding: 28px 24px 20px;
      background: var(--nts-white);
      color: var(--nts-navy);
      text-align: center;
      border-bottom: 1px solid rgba(216, 224, 234, 0.65);
    }

    .brand-logo {
      display: block;
      width: 118px;
      height: auto;
      margin: 0 auto 18px;
    }

    .brand-header h1 {
      margin: 0;
      color: var(--nts-navy);
      font-size: 24px;
      line-height: 1.35;
      letter-spacing: 0;
    }

    .brand-header p {
      margin: 9px 0 0;
      color: var(--nts-gray);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.5;
    }

    .content {
      padding: 22px;
    }

    .login-form,
    .control-grid {
      display: grid;
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field label {
      color: var(--nts-gray);
      font-size: 14px;
      font-weight: 800;
    }

    .field input,
    .field select {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid var(--nts-border);
      border-radius: 8px;
      background: #fbfcfe;
      color: var(--text-main);
      font-size: 16px;
    }

    .field input:focus,
    .field select:focus {
      outline: 3px solid rgba(1, 55, 98, 0.14);
      border-color: var(--nts-navy);
      background: var(--nts-white);
    }

    .primary-button,
    .secondary-button,
    .danger-button,
    .ghost-button {
      width: 100%;
      min-height: 48px;
      padding: 13px 16px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 900;
      line-height: 1.3;
    }

    .primary-button {
      border: 0;
      background: var(--nts-navy);
      color: var(--nts-white);
    }

    .primary-button:hover {
      background: #024A83;
    }

    .secondary-button {
      border: 1px solid var(--nts-navy);
      background: var(--nts-white);
      color: var(--nts-navy);
    }

    .secondary-button:hover {
      background: #eef5ff;
    }

    .danger-button {
      border: 1px solid rgba(227, 6, 47, 0.35);
      background: rgba(227, 6, 47, 0.08);
      color: var(--nts-red);
    }

    .ghost-button {
      border: 1px solid var(--nts-border);
      background: var(--nts-white);
      color: var(--nts-gray);
    }

    .login-error,
    .image-error,
    .empty-box,
    .load-error {
      padding: 13px 14px;
      border-radius: 8px;
      font-weight: 800;
      line-height: 1.5;
    }

    .login-error {
      display: none;
      background: rgba(227, 6, 47, 0.08);
      color: var(--nts-red);
      border: 1px solid rgba(227, 6, 47, 0.35);
    }

    .login-error.show {
      display: block;
    }

    .image-error,
    .load-error {
      background: #fdecec;
      color: var(--nts-error);
      border: 1px solid #f0a5a5;
    }

    .empty-box {
      background: #fff7e6;
      color: var(--nts-warning);
      border: 1px solid #f0cd7a;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 18px 22px;
      background: var(--nts-navy);
      color: var(--nts-white);
    }

    .top-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .top-logo {
      width: 88px;
      height: auto;
      flex: 0 0 auto;
      background: var(--nts-white);
      border-radius: 8px;
      padding: 6px;
    }

    .top-brand h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.3;
      letter-spacing: 0;
    }

    .logout-button,
    .back-button {
      flex: 0 0 auto;
      padding: 9px 11px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.12);
      color: var(--nts-white);
      font-size: 14px;
      font-weight: 900;
    }

    .logout-button:hover,
    .back-button:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .main-title {
      margin: 0 0 6px;
      color: var(--nts-navy);
      font-size: 22px;
      line-height: 1.35;
    }

    .main-subtitle {
      margin: 0 0 18px;
      color: var(--nts-gray);
      line-height: 1.6;
    }

    .summary-box {
      margin-top: 14px;
      padding: 13px 14px;
      border: 1px solid var(--nts-border);
      border-radius: 8px;
      background: #fbfcfe;
      color: var(--nts-gray);
      font-weight: 800;
      line-height: 1.5;
    }

    .quick-actions {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .quiz-card {
      max-width: 860px;
    }

    .quiz-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 20px;
      background: var(--nts-navy);
      color: var(--nts-white);
    }

    .quiz-top h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.35;
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      color: var(--nts-gray);
      font-size: 14px;
      font-weight: 900;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #eef5ff;
      color: var(--nts-navy);
      border: 1px solid #c8daf0;
      font-size: 13px;
      font-weight: 900;
      line-height: 1.2;
    }

    .question {
      margin: 0 0 18px;
      color: var(--text-main);
      font-size: 19px;
      line-height: 1.7;
      font-weight: 800;
      white-space: pre-line;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    .question-image,
    .question-html {
      white-space: normal;
    }

    .question-image img,
    .explanation-image img {
      display: block;
      width: 100%;
      height: auto;
      max-width: 100%;
      border: 1px solid var(--nts-border);
      border-radius: 10px;
      background: var(--nts-white);
    }

    .question-image a,
    .explanation-image a {
      display: block;
    }

    .question-html table {
      width: 100%;
      min-width: 520px;
      border-collapse: collapse;
      margin: 14px 0;
      font-size: 0.95rem;
      font-weight: 400;
      word-break: keep-all;
    }

    .question-html th,
    .question-html td {
      border: 1px solid var(--nts-border);
      padding: 8px 10px;
      text-align: center;
      vertical-align: middle;
    }

    .question-html th {
      background: #f1f5f9;
      color: var(--nts-navy);
      font-weight: 900;
    }

    .table-wrap {
      overflow-x: auto;
      margin: 12px 0;
      -webkit-overflow-scrolling: touch;
    }

    .choices {
      display: grid;
      gap: 11px;
    }

    .choice-button {
      width: 100%;
      min-height: 56px;
      padding: 15px 16px;
      border: 1px solid var(--nts-border);
      border-radius: 10px;
      background: var(--nts-white);
      color: var(--text-main);
      font-size: 16px;
      line-height: 1.55;
      text-align: left;
      white-space: normal;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    .choice-button:not(:disabled):hover {
      background: #eef5ff;
      border-color: var(--nts-navy);
    }

    .choice-button.correct {
      background: #e8f7ed;
      border-color: var(--nts-success);
      color: var(--nts-success);
      font-weight: 900;
    }

    .choice-button.wrong {
      background: rgba(227, 6, 47, 0.08);
      border-color: var(--nts-red);
      color: var(--nts-red);
      font-weight: 900;
    }

    .choice-button:disabled {
      cursor: default;
    }

    .result-message {
      display: none;
      margin-top: 16px;
      padding: 13px 14px;
      border-radius: 8px;
      font-weight: 900;
      line-height: 1.45;
    }

    .result-message.correct {
      display: block;
      background: #e8f7ed;
      color: var(--nts-success);
      border: 1px solid #9ed8b0;
    }

    .result-message.wrong {
      display: block;
      background: rgba(227, 6, 47, 0.08);
      color: var(--nts-red);
      border: 1px solid rgba(227, 6, 47, 0.35);
    }

    .explanation {
      display: none;
      margin-top: 12px;
      padding: 14px;
      border-left: 4px solid var(--nts-navy);
      background: #f6f9fd;
      color: #334155;
      line-height: 1.7;
      border-radius: 8px;
      white-space: pre-line;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    .explanation.show {
      display: block;
    }

    .explanation-image {
      white-space: normal;
    }

    .quiz-footer {
      position: sticky;
      bottom: 0;
      padding: 14px 20px 18px;
      border-top: 1px solid var(--nts-border);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(6px);
    }

    .score-box {
      text-align: center;
      padding: 12px 0 6px;
    }

    .score-number {
      margin: 12px 0;
      color: var(--nts-navy);
      font-size: 46px;
      line-height: 1;
      font-weight: 900;
    }

    .score-detail {
      margin: 0;
      color: var(--nts-gray);
      font-size: 16px;
      line-height: 1.7;
    }

    @media (min-width: 720px) {
      .control-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .quick-actions {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 520px) {
      .app-shell {
        padding: 12px;
        align-items: center;
      }

      .card {
        border-radius: 16px;
      }

      .brand-header {
        padding: 26px 18px 16px;
      }

      .brand-header h1 {
        font-size: 21px;
      }

      .brand-logo {
        width: 104px;
      }

      .content {
        padding: 18px;
      }

      .top-bar,
      .quiz-top {
        align-items: flex-start;
      }

      .top-logo {
        width: 76px;
      }

      .top-brand h1,
      .quiz-top h1 {
        font-size: 17px;
      }

      .question {
        font-size: 18px;
      }

      .choice-button {
        min-height: 58px;
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <section class="page active" id="loginPage">
      <div class="card login-card">
        <header class="brand-header">
          <img class="brand-logo" src="assets/logo.png" alt="국세청 로고">
          <h1>국세청 내부자격시험 문제은행</h1>
          <p>조사요원 · 세법 객관식 퀴즈</p>
        </header>

        <div class="content">
          <form class="login-form" id="loginForm">
            <div class="field">
              <label for="usernameInput">아이디</label>
              <input id="usernameInput" type="text" autocomplete="username" required>
            </div>

            <div class="field">
              <label for="passwordInput">비밀번호</label>
              <input id="passwordInput" type="password" autocomplete="current-password" required>
            </div>

            <div class="login-error" id="loginError">아이디 또는 비밀번호가 올바르지 않습니다.</div>
            <button class="login-button primary-button" type="submit">로그인</button>
          </form>
        </div>
      </div>
    </section>

    <section class="page" id="mainPage">
      <div class="card">
        <header class="top-bar">
          <div class="top-brand">
            <img class="top-logo" src="assets/logo.png" alt="국세청 로고">
            <h1>국세청 내부자격시험 문제은행</h1>
          </div>
          <button class="logout-button" id="mainLogoutButton" type="button">로그아웃</button>
        </header>

        <div class="content">
          <h2 class="main-title">퀴즈 설정</h2>
          <p class="main-subtitle">과목과 챕터를 고른 뒤 원하는 문항 수로 퀴즈를 시작하세요.</p>

          <div class="control-grid">
            <div class="field">
              <label for="subjectFilter">세법 선택</label>
              <select id="subjectFilter" disabled>
                <option value="all">전체 과목</option>
              </select>
            </div>

            <div class="field">
              <label for="chapterFilter">챕터 선택</label>
              <select id="chapterFilter" disabled>
                <option value="all">전체 챕터</option>
              </select>
            </div>

            <div class="field">
              <label for="questionCountSelect">출제 문항 수</label>
              <select id="questionCountSelect" disabled>
                <option value="10">10문제</option>
                <option value="20" selected>20문제</option>
                <option value="30">30문제</option>
                <option value="all">전체</option>
              </select>
            </div>
          </div>

          <div class="summary-box" id="filterSummary">문제 데이터를 불러오는 중입니다.</div>

          <div class="quick-actions">
            <button class="primary-button" id="startSelectedButton" type="button" disabled>선택 범위로 퀴즈 시작</button>
            <button class="secondary-button" id="quickStartButton" type="button" disabled>전체 랜덤 20문제</button>
            <button class="danger-button" id="imageReviewButton" type="button" disabled>이미지 문제만 검수</button>
          </div>
        </div>
      </div>
    </section>

    <section class="page" id="quizPage">
      <div class="card quiz-card">
        <header class="quiz-top">
          <button class="back-button" id="backToMainButton" type="button">뒤로가기</button>
          <h1>퀴즈 풀이</h1>
        </header>

        <div class="content">
          <div class="progress-row">
            <span id="questionCount">0 / 0</span>
            <span id="scoreCount">정답 0개</span>
          </div>

          <div class="badge-row" id="questionMeta"></div>
          <div class="question" id="questionText"></div>
          <div class="choices" id="choicesArea"></div>
          <div class="result-message" id="resultMessage"></div>
          <div class="explanation" id="explanationBox"></div>
        </div>

        <footer class="quiz-footer">
          <button class="primary-button" id="nextButton" disabled>다음 문제</button>
        </footer>
      </div>
    </section>
  </main>

  <script>
    const USERS = [
      { username: "admin", password: "1234" }
    ];

    const LOGIN_SESSION_KEY = "quizBankLoggedIn";
    const DATA_FILE = "./questions_v3_explanation_images.json";
    const DEFAULT_ROUND_COUNT = 20;

    let allQuestions = [];
    let roundQuestions = [];
    let currentQuestionIndex = 0;
    let correctCount = 0;
    let hasAnswered = false;
    let currentMode = "all";

    const loginPage = document.getElementById("loginPage");
    const mainPage = document.getElementById("mainPage");
    const quizPage = document.getElementById("quizPage");
    const loginForm = document.getElementById("loginForm");
    const usernameInput = document.getElementById("usernameInput");
    const passwordInput = document.getElementById("passwordInput");
    const loginError = document.getElementById("loginError");
    const mainLogoutButton = document.getElementById("mainLogoutButton");
    const subjectFilter = document.getElementById("subjectFilter");
    const chapterFilter = document.getElementById("chapterFilter");
    const questionCountSelect = document.getElementById("questionCountSelect");
    const filterSummary = document.getElementById("filterSummary");
    const startSelectedButton = document.getElementById("startSelectedButton");
    const quickStartButton = document.getElementById("quickStartButton");
    const imageReviewButton = document.getElementById("imageReviewButton");
    const backToMainButton = document.getElementById("backToMainButton");
    const questionCount = document.getElementById("questionCount");
    const scoreCount = document.getElementById("scoreCount");
    const questionMeta = document.getElementById("questionMeta");
    const questionText = document.getElementById("questionText");
    const choicesArea = document.getElementById("choicesArea");
    const resultMessage = document.getElementById("resultMessage");
    const explanationBox = document.getElementById("explanationBox");
    const nextButton = document.getElementById("nextButton");

    function showPage(pageName) {
      loginPage.classList.toggle("active", pageName === "login");
      mainPage.classList.toggle("active", pageName === "main");
      quizPage.classList.toggle("active", pageName === "quiz");
    }

    function isLoggedIn() {
      return sessionStorage.getItem(LOGIN_SESSION_KEY) === "true";
    }

    function showScreenForLoginState() {
      if (isLoggedIn()) {
        showPage("main");
        loadQuestionsIfNeeded();
      } else {
        showPage("login");
        usernameInput.focus();
      }
    }

    function handleLogin(event) {
      event.preventDefault();

      const username = usernameInput.value.trim();
      const password = passwordInput.value;
      const matchedUser = USERS.find(function(user) {
        return user.username === username && user.password === password;
      });

      if (!matchedUser) {
        loginError.classList.add("show");
        passwordInput.value = "";
        passwordInput.focus();
        return;
      }

      sessionStorage.setItem(LOGIN_SESSION_KEY, "true");
      loginError.classList.remove("show");
      passwordInput.value = "";
      showScreenForLoginState();
    }

    function handleLogout() {
      sessionStorage.removeItem(LOGIN_SESSION_KEY);
      window.location.reload();
    }

    async function loadQuestionsIfNeeded() {
      if (allQuestions.length > 0) {
        updateMainSummary();
        return;
      }

      await loadQuestions();
    }

    async function loadQuestions() {
      try {
        const response = await fetch(DATA_FILE, { cache: "no-store" });

        if (!response.ok) {
          throw new Error("문제 데이터 응답 오류");
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
          throw new Error("문제 데이터는 배열이어야 합니다.");
        }

        allQuestions = data;
        setupMainControls();
        updateMainSummary();
      } catch (error) {
        filterSummary.innerHTML = `<div class="load-error">문제 데이터를 불러오지 못했습니다.</div>`;
      }
    }

    function setupMainControls() {
      const subjects = getUniqueValues(allQuestions, "subject");

      subjectFilter.innerHTML = `<option value="all">전체 과목</option>`;

      subjects.forEach(function(subject) {
        const option = document.createElement("option");
        option.value = subject;
        option.textContent = subject;
        subjectFilter.appendChild(option);
      });

      subjectFilter.disabled = false;
      chapterFilter.disabled = false;
      questionCountSelect.disabled = false;
      startSelectedButton.disabled = false;
      quickStartButton.disabled = false;
      imageReviewButton.disabled = false;

      updateChapterOptions();
    }

    function getUniqueValues(questionList, key) {
      const values = questionList.map(function(question) {
        return question[key];
      });

      return [...new Set(values)]
        .filter(function(value) {
          return value !== undefined && value !== null && value !== "";
        })
        .sort(function(a, b) {
          return String(a).localeCompare(String(b), "ko");
        });
    }

    function updateChapterOptions() {
      const selectedSubject = subjectFilter.value;
      const questionsForSubject = selectedSubject === "all"
        ? allQuestions
        : allQuestions.filter(function(question) {
            return question.subject === selectedSubject;
          });

      const chapterMap = new Map();

      questionsForSubject.forEach(function(question) {
        const chapterKey = makeChapterKey(question);

        if (!chapterMap.has(chapterKey)) {
          chapterMap.set(chapterKey, {
            chapter: question.chapter,
            chapterTitle: question.chapterTitle
          });
        }
      });

      const chapters = [...chapterMap.values()].sort(function(a, b) {
        return Number(a.chapter) - Number(b.chapter) || String(a.chapterTitle).localeCompare(String(b.chapterTitle), "ko");
      });

      chapterFilter.innerHTML = `<option value="all">전체 챕터</option>`;

      chapters.forEach(function(chapterInfo) {
        const option = document.createElement("option");
        option.value = `${chapterInfo.chapter}__${chapterInfo.chapterTitle}`;
        option.textContent = `${chapterInfo.chapter}장 ${chapterInfo.chapterTitle}`;
        chapterFilter.appendChild(option);
      });
    }

    function makeChapterKey(question) {
      return `${question.chapter}__${question.chapterTitle}`;
    }

    function getFilteredQuestions(mode) {
      const selectedSubject = subjectFilter.value;
      const selectedChapter = chapterFilter.value;
      const selectedMode = mode || currentMode;

      return allQuestions.filter(function(question) {
        const subjectMatches = selectedSubject === "all" || question.subject === selectedSubject;
        const chapterMatches = selectedChapter === "all" || makeChapterKey(question) === selectedChapter;
        const imageMatches = selectedMode !== "image" || (question.displayType === "image" && question.questionImage);

        return subjectMatches && chapterMatches && imageMatches;
      });
    }

    function getSelectedQuestionLimit() {
      const value = questionCountSelect.value;

      if (value === "all") {
        return "all";
      }

      return Number(value);
    }

    function updateMainSummary() {
      const filteredQuestions = getFilteredQuestions(currentMode);
      const imageCount = filteredQuestions.filter(function(question) {
        return question.displayType === "image" && question.questionImage;
      }).length;
      const textCount = filteredQuestions.length - imageCount;

      filterSummary.textContent = `현재 선택 조건에 맞는 문제: ${filteredQuestions.length}개 · 텍스트 ${textCount}개 · 이미지 ${imageCount}개`;
    }

    function startQuizFromSelection() {
      currentMode = "all";
      startQuiz(getFilteredQuestions("all"), getSelectedQuestionLimit());
    }

    function startQuickQuiz() {
      currentMode = "all";
      subjectFilter.value = "all";
      updateChapterOptions();
      chapterFilter.value = "all";
      questionCountSelect.value = "20";
      updateMainSummary();
      startQuiz(getFilteredQuestions("all"), DEFAULT_ROUND_COUNT);
    }

    function startImageReviewQuiz() {
      currentMode = "image";
      questionCountSelect.value = "20";
      updateMainSummary();
      startQuiz(getFilteredQuestions("image"), getSelectedQuestionLimit());
    }

    function startQuiz(sourceQuestions, limit) {
      const count = limit === "all" ? sourceQuestions.length : limit;
      roundQuestions = pickRandomQuestions(sourceQuestions, count);
      currentQuestionIndex = 0;
      correctCount = 0;
      hasAnswered = false;

      if (roundQuestions.length === 0) {
        filterSummary.innerHTML = `<div class="empty-box">선택한 조건에 해당하는 문제가 없습니다.</div>`;
        showPage("main");
        return;
      }

      showPage("quiz");
      showQuestion();
    }

    function pickRandomQuestions(questionList, maxCount) {
      const copiedList = [...questionList];

      for (let i = copiedList.length - 1; i > 0; i = i - 1) {
        const randomIndex = Math.floor(Math.random() * (i + 1));
        const temporary = copiedList[i];
        copiedList[i] = copiedList[randomIndex];
        copiedList[randomIndex] = temporary;
      }

      const count = Math.min(maxCount, copiedList.length);
      return copiedList.slice(0, count);
    }

    function showQuestion() {
      const currentQuestion = roundQuestions[currentQuestionIndex];
      const totalRoundQuestions = roundQuestions.length;

      hasAnswered = false;
      nextButton.disabled = true;
      nextButton.textContent = currentQuestionIndex === totalRoundQuestions - 1 ? "결과 보기" : "다음 문제";

      questionCount.textContent = `${currentQuestionIndex + 1} / ${totalRoundQuestions}`;
      scoreCount.textContent = `정답 ${correctCount}개`;
      renderQuestionMeta(currentQuestion);
      renderQuestion(currentQuestion);

      resultMessage.className = "result-message";
      resultMessage.textContent = "";
      explanationBox.className = "explanation";
      explanationBox.textContent = "";
      choicesArea.innerHTML = "";

      currentQuestion.choices.forEach(function(choiceText, index) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "choice-button";
        button.textContent = `${index + 1}. ${choiceText}`;

        button.addEventListener("click", function() {
          checkAnswer(index + 1);
        });

        choicesArea.appendChild(button);
      });
    }

    function renderQuestionMeta(currentQuestion) {
      const badges = [
        currentQuestion.subject,
        `${currentQuestion.chapter}장 ${currentQuestion.chapterTitle}`,
        `난이도 ${currentQuestion.difficulty || "-"}`
      ];

      questionMeta.innerHTML = badges.map(function(text) {
        return `<span class="badge">${escapeHtml(text)}</span>`;
      }).join("");
    }

    function renderQuestion(currentQuestion) {
      const displayType = currentQuestion.displayType;
      const questionImage = currentQuestion.questionImage;
      const questionHtml = currentQuestion.questionHtml;
      const questionFormatted = currentQuestion.questionFormatted;
      const question = currentQuestion.question;

      if (displayType === "image" && questionImage) {
        questionText.className = "question question-image";
        questionText.innerHTML = "";
        questionText.appendChild(createLinkedImage(normalizeImagePath(questionImage), question || "문제 이미지", "문제 이미지를 불러오지 못했습니다.", questionText));
        return;
      }

      if (questionHtml && displayType !== "text") {
        questionText.className = "question question-html";
        questionText.innerHTML = questionHtml;
        wrapQuestionTables();
        return;
      }

      questionText.className = "question";
      questionText.textContent = questionFormatted || question || "";
    }

    function createLinkedImage(src, alt, errorMessage, container) {
      const link = document.createElement("a");
      link.href = src;
      link.target = "_blank";
      link.rel = "noopener noreferrer";

      const image = document.createElement("img");
      image.src = src;
      image.alt = alt;
      image.loading = "lazy";
      image.onerror = function() {
        container.innerHTML = `<div class="image-error">${errorMessage}</div>`;
      };

      link.appendChild(image);
      return link;
    }

    function normalizeImagePath(path) {
      if (!path) {
        return "";
      }

      return path
        .replace("question_images-", "question_images/")
        .replace("explanation_images-", "explanation_images/");
    }

    function wrapQuestionTables() {
      const tables = questionText.querySelectorAll("table");

      tables.forEach(function(table) {
        if (table.parentElement && table.parentElement.classList.contains("table-wrap")) {
          return;
        }

        const wrapper = document.createElement("div");
        wrapper.className = "table-wrap";
        table.parentNode.insertBefore(wrapper, table);
        wrapper.appendChild(table);
      });
    }

    function checkAnswer(selectedAnswer) {
      if (hasAnswered) {
        return;
      }

      hasAnswered = true;
      nextButton.disabled = false;

      const currentQuestion = roundQuestions[currentQuestionIndex];
      const isCorrect = selectedAnswer === currentQuestion.answer;
      const allChoiceButtons = document.querySelectorAll(".choice-button");

      if (isCorrect) {
        correctCount = correctCount + 1;
        resultMessage.className = "result-message correct";
        resultMessage.textContent = "정답입니다.";
      } else {
        resultMessage.className = "result-message wrong";
        resultMessage.textContent = "오답입니다.";
      }

      scoreCount.textContent = `정답 ${correctCount}개`;

      allChoiceButtons.forEach(function(button, index) {
        const choiceNumber = index + 1;

        button.disabled = true;

        if (choiceNumber === currentQuestion.answer) {
          button.classList.add("correct");
        }

        if (choiceNumber === selectedAnswer && !isCorrect) {
          button.classList.add("wrong");
        }
      });

      renderExplanation(currentQuestion);
    }

    function renderExplanation(currentQuestion) {
      const explanationDisplayType = currentQuestion.explanationDisplayType;
      const explanationImage = currentQuestion.explanationImage;
      const explanationText = currentQuestion.explanationFormatted || currentQuestion.explanation || "";

      explanationBox.className = "explanation show";

      if (explanationDisplayType === "image" && explanationImage) {
        explanationBox.className = "explanation explanation-image show";
        explanationBox.innerHTML = "";
        explanationBox.appendChild(createLinkedImage(normalizeImagePath(explanationImage), explanationText || "해설 이미지", "해설 이미지를 불러오지 못했습니다.", explanationBox));
        return;
      }

      explanationBox.textContent = `해설: ${explanationText}`;
    }

    function goToNextQuestion() {
      currentQuestionIndex = currentQuestionIndex + 1;

      if (currentQuestionIndex < roundQuestions.length) {
        showQuestion();
      } else {
        showFinalScore();
      }
    }

    function showFinalScore() {
      const totalQuestions = roundQuestions.length;
      const percentage = Math.round((correctCount / totalQuestions) * 100);

      questionMeta.innerHTML = "";
      questionText.className = "question";
      questionText.textContent = "";
      choicesArea.innerHTML = "";
      resultMessage.className = "result-message";
      resultMessage.textContent = "";
      explanationBox.className = "explanation";
      explanationBox.textContent = "";

      questionCount.textContent = `${totalQuestions} / ${totalQuestions}`;
      scoreCount.textContent = `정답 ${correctCount}개`;

      choicesArea.innerHTML = `
        <div class="score-box">
          <p class="question">시험 결과</p>
          <div class="score-number">${percentage}%</div>
          <p class="score-detail">
            총 문제 수: ${totalQuestions}문제<br>
            정답 수: ${correctCount}문제<br>
            정답률: ${percentage}%
          </p>
        </div>
      `;

      nextButton.textContent = "처음부터 다시 풀기";
      nextButton.disabled = false;
      nextButton.removeEventListener("click", goToNextQuestion);
      nextButton.addEventListener("click", restartCurrentQuiz, { once: true });
    }

    function restartCurrentQuiz() {
      nextButton.addEventListener("click", goToNextQuestion);
      startQuiz(roundQuestions, roundQuestions.length);
    }

    function goBackToMain() {
      nextButton.removeEventListener("click", restartCurrentQuiz);
      nextButton.addEventListener("click", goToNextQuestion);
      updateMainSummary();
      showPage("main");
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    loginForm.addEventListener("submit", handleLogin);
    mainLogoutButton.addEventListener("click", handleLogout);
    subjectFilter.addEventListener("change", function() {
      currentMode = "all";
      updateChapterOptions();
      updateMainSummary();
    });
    chapterFilter.addEventListener("change", function() {
      currentMode = "all";
      updateMainSummary();
    });
    questionCountSelect.addEventListener("change", updateMainSummary);
    startSelectedButton.addEventListener("click", startQuizFromSelection);
    quickStartButton.addEventListener("click", startQuickQuiz);
    imageReviewButton.addEventListener("click", startImageReviewQuiz);
    backToMainButton.addEventListener("click", goBackToMain);
    nextButton.addEventListener("click", goToNextQuestion);

    showScreenForLoginState();
  </script>
</body>
</html>
